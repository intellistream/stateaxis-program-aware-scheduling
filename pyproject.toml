[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-program-aware-scheduling"
version = "0.2.0"
description = "Bounded attained-service program scheduling for StateAxis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-program-aware-scheduling" = "stateaxis_program_aware_scheduling"

[project.entry-points."stateaxis.mod_handlers"]
program_aware_scheduling = "stateaxis_program_aware_scheduling:program_aware_scheduling"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_program_aware_scheduling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
